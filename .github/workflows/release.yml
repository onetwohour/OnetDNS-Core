name: Release

# Pushing a tag that starts with v builds a binary for every target and publishes a
# GitHub release. The tag must be v followed by the [workspace.package] version in
# Cargo.toml. A version with a hyphen suffix, such as 0.1.0-alpha.1, is published as a
# pre-release. This workflow does not rerun the tests. Instead it refuses to release
# unless the tagged commit is on main and the CI workflow passed for that exact commit.
#
# Running installations update themselves from the bare executables, which the signed
# OnetDNS-release.toml lists with their sizes and hashes. The publish job signs it in the
# release environment and creates no release unless a key in onetdns-bin/release-keys.txt
# verifies the signature.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi
      - name: Require CI to have passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag pushed right after main may arrive while CI is still running, so wait for it.
          for attempt in $(seq 1 90); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=100")
            if [ "$(echo "$runs" | jq '[.workflow_runs[] | select(.conclusion == "success")] | length')" -gt 0 ]; then
              exit 0
            fi
            if [ "$(echo "$runs" | jq '[.workflow_runs[] | select(.status != "completed")] | length')" -eq 0 ]; then
              echo "::error::No passing CI run on main for $GITHUB_SHA. Fix CI, then tag a commit whose CI passed."
              exit 1
            fi
            sleep 60
          done
          echo "::error::CI for $GITHUB_SHA did not finish within 90 minutes."
          exit 1
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Match tag and package version
        id: version
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "onetdns") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version. Name the tag v$version."
            exit 1
          fi
          case "$version" in
            # Self-update skips tags it cannot order, and semver leaves build metadata out of
            # the ordering, so such a release would never be offered.
            *+*)
              echo "::error::Version $version carries build metadata (+...), so installations would not update to it. Remove it."
              exit 1
              ;;
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            emulator: qemu-aarch64
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            emulator: qemu-arm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: i686-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            emulator: arch -x86_64
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      EMULATOR: ${{ matrix.emulator }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}

      - name: Install emulator (Linux)
        if: runner.os == 'Linux' && matrix.emulator
        run: sudo apt-get update && sudo apt-get install -y qemu-user

      - name: Install Rosetta (macOS)
        if: runner.os == 'macOS' && matrix.emulator
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="-D warnings"
          case "$RUNNER_OS" in
            # Link statically with the musl CRT and rust-lld that ship with the target's
            # standard library, so no C cross-compiler is needed.
            Linux) RUSTFLAGS="$RUSTFLAGS -C linker=rust-lld -C link-self-contained=yes" ;;
            # Bundle the C runtime so the binary runs without the Visual C++ Redistributable.
            Windows) RUSTFLAGS="$RUSTFLAGS -C target-feature=+crt-static" ;;
          esac
          export RUSTFLAGS
          # The binary looks up its own executable in the release manifest by this key, and a
          # binary built without it never updates itself.
          export ONETDNS_RELEASE_TARGET="$TARGET"
          cargo build -p onetdns --release --locked --target "$TARGET"

      - name: Check linkage and version
        shell: bash
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/OnetDNS"
          case "$RUNNER_OS" in
            Linux)
              headers=$(readelf -lW "$bin")
              if grep INTERP <<<"$headers"; then
                echo "::error::The binary requires a dynamic loader; static linking was lost."
                exit 1
              fi
              ;;
            Windows)
              bin="$bin.exe"
              if grep -aqiE 'vcruntime[0-9]+\.dll|api-ms-win-crt-' "$bin"; then
                echo "::error::The binary requires C runtime DLLs; the static C runtime was dropped."
                exit 1
              fi
              ;;
          esac
          reported=$($EMULATOR "$bin" --version)
          if [ "$reported" != "OnetDNS $VERSION" ]; then
            echo "::error::Unexpected --version output: got '$reported', expected 'OnetDNS $VERSION'."
            exit 1
          fi
          echo "$reported"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="OnetDNS-$VERSION-$TARGET"
          mkdir -p "pkg/$name" dist
          # Each archive gets its bare executable alongside, the file self-update downloads.
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/OnetDNS.exe" LICENSE README.md "pkg/$name/"
            (cd pkg && 7z a -tzip "../dist/$name.zip" "$name")
            cp "target/$TARGET/release/OnetDNS.exe" "dist/$name.exe"
          else
            install -m 755 "target/$TARGET/release/OnetDNS" "pkg/$name/"
            install -m 644 LICENSE README.md "pkg/$name/"
            # Record root as the owner. If the runner's uid were recorded, extracting as root
            # would let whichever local account has that uid replace the binary.
            if [ "$RUNNER_OS" = macOS ]; then
              owner=(--uid 0 --gid 0)
            else
              owner=(--owner=0 --group=0 --numeric-owner)
            fi
            tar "${owner[@]}" -C pkg -czf "dist/$name.tar.gz" "$name"
            install -m 755 "target/$TARGET/release/OnetDNS" "dist/$name"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    # The manifest signing key is a secret of this environment. The environment requires the
    # owner's approval, so pushing a tag alone cannot produce a signed release.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: onetdns-bin/release-keys.txt
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum OnetDNS-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write the release manifest
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # Update contract number. A test in onetdns-bin/src/update/mod.rs keeps it equal to
          # CONTRACT there.
          UPDATE_CONTRACT: 1
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifest=OnetDNS-release.toml
          prefix="OnetDNS-$VERSION-"
          printf 'format = %s\nproduct = "OnetDNS"\nversion = "%s"\n' "$UPDATE_CONTRACT" "$VERSION" > "$manifest"
          archives=("$prefix"*.tar.gz "$prefix"*.zip)
          executables=0
          for file in "$prefix"*; do
            case "$file" in
              *.tar.gz | *.zip) continue ;;
            esac
            target=${file#"$prefix"}
            target=${target%.exe}
            # Installations derive the file name from their target and reject a manifest
            # that names any file differently.
            case "$target" in
              *-windows-*) expected="$prefix$target.exe" ;;
              *) expected="$prefix$target" ;;
            esac
            if [ "$file" != "$expected" ]; then
              echo "::error::$file must be named $expected."
              exit 1
            fi
            printf '\n[[asset]]\ntarget = "%s"\nfile = "%s"\nsize = %s\nsha256 = "%s"\n' \
              "$target" "$file" "$(stat -c %s "$file")" "$(sha256sum "$file" | cut -d ' ' -f 1)" >> "$manifest"
            executables=$((executables + 1))
          done
          if [ "$executables" -eq 0 ] || [ "$executables" -ne "${#archives[@]}" ]; then
            echo "::error::Found $executables executables for ${#archives[@]} archives. Every target must publish both."
            exit 1
          fi
          cat "$manifest"

      - name: Sign the release manifest
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::The release environment has no RELEASE_SIGNING_KEY secret."
            exit 1
          fi
          key="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -rawin -inkey "$key" -in OnetDNS-release.toml -out OnetDNS-release.toml.sig

      - name: Verify the signature with the trusted keys
        working-directory: dist
        run: |
          set -euo pipefail
          # Installations trust only these keys, so a release no listed key verifies could
          # never be installed by them.
          der="$RUNNER_TEMP/release-key.der"
          listed=0
          while read -r line || [ -n "$line" ]; do
            line=${line%$'\r'}
            case "$line" in
              '' | '#'*) continue ;;
            esac
            if ! [[ "$line" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::onetdns-bin/release-keys.txt has a line that is not 64 lowercase hexadecimal characters."
              exit 1
            fi
            listed=$((listed + 1))
            # DER SubjectPublicKeyInfo of a raw Ed25519 public key is this fixed prefix and the key.
            printf '%b' "$(printf '302a300506032b6570032100%s' "$line" | sed 's/../\\x&/g')" > "$der"
            if openssl pkeyutl -verify -pubin -keyform DER -inkey "$der" -rawin \
              -in OnetDNS-release.toml -sigfile OnetDNS-release.toml.sig > /dev/null; then
              echo "The manifest signature verifies with release key $line."
              exit 0
            fi
          done < ../source/onetdns-bin/release-keys.txt
          if [ "$listed" -eq 0 ]; then
            echo "::error::onetdns-bin/release-keys.txt lists no release key, so installations could not verify this release."
          else
            echo "::error::None of the $listed keys in onetdns-bin/release-keys.txt verifies the manifest signature, so installations would reject this release."
          fi
          exit 1

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            cat <<'EOF'
          OnetDNS is an ad-blocking DNS resolver that ships as a single self-contained binary. It answers over plain DNS, DNS-over-TLS, DNS-over-HTTPS (HTTP/2 and HTTP/3), DNS-over-QUIC and DNSCrypt, resolves by forwarding, full recursion or a split of the two, validates and signs DNSSEC, and can also serve authoritative zones and DHCP. A web dashboard is built in.

          EOF
            if [ "$PRERELEASE" = true ]; then
              cat <<'EOF'
          > [!WARNING]
          > This is a pre-release. The configuration format and management API may change without notice.

          EOF
            fi
            cat <<'EOF'
          ## Downloads

          | Platform | Archive |
          |---|---|
          | Linux x86-64 | `OnetDNS-@VERSION@-x86_64-unknown-linux-musl.tar.gz` |
          | Linux x86 (32-bit) | `OnetDNS-@VERSION@-i686-unknown-linux-musl.tar.gz` |
          | Linux ARM64 | `OnetDNS-@VERSION@-aarch64-unknown-linux-musl.tar.gz` |
          | Linux ARMv7 | `OnetDNS-@VERSION@-armv7-unknown-linux-musleabihf.tar.gz` |
          | Windows x64 | `OnetDNS-@VERSION@-x86_64-pc-windows-msvc.zip` |
          | Windows x86 (32-bit) | `OnetDNS-@VERSION@-i686-pc-windows-msvc.zip` |
          | macOS Apple silicon | `OnetDNS-@VERSION@-aarch64-apple-darwin.tar.gz` |
          | macOS Intel | `OnetDNS-@VERSION@-x86_64-apple-darwin.tar.gz` |

          Linux builds are statically linked against musl and run on any distribution. Windows builds bundle the C runtime and need no Visual C++ Redistributable.

          Each target also has its bare executable, named like its archive without the extension (with `.exe` on Windows). OnetDNS installations update themselves from these files after checking them against the signed `OnetDNS-release.toml`.

          ## Verify your download

          Every archive and executable is listed in `SHA256SUMS`:

          ```sh
          sha256sum -c SHA256SUMS --ignore-missing
          ```

          EOF
          } | sed "s/@VERSION@/$VERSION/g" > "$notes"
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "OnetDNS $VERSION" --notes-file "$notes" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
